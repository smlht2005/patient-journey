name: CI + Zeabur Deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (Next.js standalone)
        run: npm run build
        env:
          # CI 用假值讓 build 通過（實際值在 Zeabur 環境變數設定）
          SESSION_SECRET: ci_only_secret_not_used_in_production_00000
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          SMART_CLIENT_ID: ci-client
          FHIR_ISS: https://launch.smarthealthit.org/v/r4/fhir
          SMART_REDIRECT_URI: http://localhost:3000/api/auth/callback
          SMART_SCOPES: launch openid fhirUser patient/*.read offline_access
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          ALLOWED_EHR_ORIGINS: "*"

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # Zeabur 透過 GitHub 整合自動部署，此 job 僅記錄狀態
  deploy-status:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy trigger
        run: |
          echo "✅ Build passed — Zeabur 將自動從 main branch 觸發部署"
          echo "🔗 Zeabur Dashboard: https://dash.zeabur.com"
