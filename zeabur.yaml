# Zeabur 部署設定 — Patient Journey (Next.js)
# 文件：https://zeabur.com/docs
apiVersion: zeabur.com/v1
metadata:
  name: patient-journey
spec:
  template:
    spec:
      services:
        - name: patient-journey
          template: PREBUILT
          spec:
            source:
              git:
                repoID: smlht2005/patient-journey
                branch: main
            ports:
              - id: web
                port: 3000
                type: HTTP
            env:
              # ── 必填：啟動前請於 Zeabur Dashboard 設定 ─────────────────
              - key: SESSION_SECRET
                description: "iron-session 加密密鑰（至少 32 字元隨機字串）"
              - key: LLM_PROVIDER
                description: "LLM 提供者：claude | deepseek（預設 deepseek）"
                value: "deepseek"
              - key: ANTHROPIC_API_KEY
                description: "Anthropic Claude API Key (sk-ant-...)，LLM_PROVIDER=claude 時必填"
              - key: DEEPSEEK_API_KEY
                description: "DeepSeek API Key (sk-...)，LLM_PROVIDER=deepseek 時必填"
              - key: SMART_CLIENT_ID
                description: "SMART on FHIR client_id，例如 patient-journey-poc"
              - key: FHIR_ISS
                description: "FHIR Server base URL"
                value: "https://launch.smarthealthit.org/v/r4/fhir"
              - key: SMART_REDIRECT_URI
                description: "https://<your-zeabur-domain>/api/auth/callback"
              - key: SMART_SCOPES
                value: "launch openid fhirUser patient/*.read offline_access"
              - key: ALLOWED_EHR_ORIGINS
                description: "允許的 EHR CORS origin，逗號分隔；生產環境請收緊"
                value: "*"
              - key: NEXT_PUBLIC_BASE_URL
                description: "https://<your-zeabur-domain>"
              # ── Zeabur 自動注入（無需手動設定）─────────────────────────
              - key: PORT
                description: "Zeabur 自動注入，app 透過 npm run start 讀取"
            resources:
              cpu: 0.5
              memory: 512Mi
